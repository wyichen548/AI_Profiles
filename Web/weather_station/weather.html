<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣即時天氣氣象站</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* 玻璃擬態效果 */
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* 隱藏滾動條但仍可滾動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-400 via-indigo-500 to-purple-600 text-white transition-colors duration-700 flex flex-col justify-between p-4 md:p-8">

    <!-- 主容器 -->
    <div class="max-w-4xl mx-auto w-full">
        
        <!-- 頂部標題與城市選擇器 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="flex items-center gap-3">
                <div class="p-3 bg-white/20 rounded-2xl backdrop-blur-md">
                    <i class="fa-solid font-bold text-2xl text-yellow-300 fa-cloud-sun"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide">台灣即時天氣</h1>
                    <p class="text-xs text-white/80">Open-Meteo 免費 API 氣象資訊</p>
                </div>
            </div>

            <div class="flex items-center gap-2 w-full md:w-auto">
                <!-- 縣市下拉選單 -->
                <select id="citySelect" class="glass-dark text-white rounded-xl px-4 py-2.5 outline-none border border-white/20 w-full md:w-48 cursor-pointer focus:ring-2 focus:ring-white/50 transition">
                    <!-- JavaScript 將動態生成縣市選項 -->
                </select>
                <!-- 當前定位按鈕 -->
                <button id="locateBtn" class="glass p-2.5 rounded-xl hover:bg-white/30 transition flex items-center justify-center shrink-0" title="使用我的當前位置">
                    <i class="fa-solid fa-location-crosshairs text-lg"></i>
                </button>
            </div>
        </header>

        <!-- 主要載入狀態與內容區塊 -->
        <main id="mainContent" class="space-y-6">

            <!-- 載入中骨架屏 / 動畫 -->
            <div id="loading" class="hidden flex flex-col items-center justify-center py-20 gap-4">
                <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-white/90">正在取得天氣氣象資料...</p>
            </div>

            <!-- 錯誤提示訊息 -->
            <div id="errorMessage" class="hidden glass-dark border-red-500/50 p-4 rounded-2xl text-red-200 flex items-center gap-3">
                <i class="fa-solid fa-triangle-exclamation text-xl text-red-400"></i>
                <span id="errorText">無法讀取資料，請稍後再試。</span>
            </div>

            <!-- 天氣主卡片 -->
            <div id="weatherView" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- 即時天氣重點展示（左側/大區塊） -->
                <div class="md:col-span-2 glass rounded-3xl p-6 md:p-8 flex flex-col justify-between relative overflow-hidden shadow-2xl">
                    <!-- 背景天候裝飾水滴/光暈 -->
                    <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>

                    <div>
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 id="cityName" class="text-3xl font-extrabold tracking-tight">台北市</h2>
                                <p id="currentDate" class="text-sm text-white/80 mt-1">2026年11月5日 星期四</p>
                            </div>
                            <span id="weatherTag" class="px-3 py-1 bg-white/20 rounded-full text-xs font-semibold tracking-wider">即時資訊</span>
                        </div>

                        <!-- 溫度與圖示 -->
                        <div class="flex items-center justify-between my-8">
                            <div>
                                <div class="flex items-baseline">
                                    <span id="temp" class="text-6xl md:text-8xl font-black tracking-tighter">--</span>
                                    <span class="text-3xl md:text-4xl font-light ml-1">°C</span>
                                </div>
                                <p id="weatherStateText" class="text-lg md:text-xl font-medium mt-1 text-white/90">晴朗</p>
                            </div>
                            <!-- 動態天氣 Icon -->
                            <div id="weatherIcon" class="text-7xl md:text-8xl text-yellow-300 drop-shadow-md">
                                <i class="fa-solid fa-sun"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 附加數據 grid -->
                    <div class="grid grid-cols-3 gap-3 pt-6 border-t border-white/15">
                        <div class="flex flex-col items-center p-2 rounded-xl bg-white/5">
                            <span class="text-xs text-white/70 flex items-center gap-1">
                                <i class="fa-solid fa-temperature-half"></i> 體感溫度
                            </span>
                            <span id="feelsLike" class="text-lg font-bold mt-1">--°C</span>
                        </div>
                        <div class="flex flex-col items-center p-2 rounded-xl bg-white/5">
                            <span class="text-xs text-white/70 flex items-center gap-1">
                                <i class="fa-solid fa-droplet text-blue-300"></i> 相對濕度
                            </span>
                            <span id="humidity" class="text-lg font-bold mt-1">--%</span>
                        </div>
                        <div class="flex flex-col items-center p-2 rounded-xl bg-white/5">
                            <span class="text-xs text-white/70 flex items-center gap-1">
                                <i class="fa-solid fa-wind text-teal-300"></i> 風速
                            </span>
                            <span id="windSpeed" class="text-lg font-bold mt-1">-- km/h</span>
                        </div>
                    </div>
                </div>

                <!-- 氣象延伸資訊卡片（右側） -->
                <div class="space-y-6">
                    <!-- 今日詳細數值 -->
                    <div class="glass rounded-3xl p-6 shadow-xl">
                        <h3 class="text-base font-semibold mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-circle-info text-sky-300"></i> 今日詳細資訊
                        </h3>
                        <div class="space-y-3.5 text-sm">
                            <div class="flex justify-between items-center">
                                <span class="text-white/80"><i class="fa-solid fa-umbrella w-5 text-indigo-300"></i> 降雨機率</span>
                                <span id="rainProb" class="font-semibold">-- %</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-white/80"><i class="fa-solid fa-sun w-5 text-amber-300"></i> 紫外線指數</span>
                                <span id="uvIndex" class="font-semibold">--</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-white/80"><i class="fa-solid fa-gauge-high w-5 text-emerald-300"></i> 大氣氣壓</span>
                                <span id="pressure" class="font-semibold">-- hPa</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-white/80"><i class="fa-solid fa-eye w-5 text-purple-300"></i> 能見度</span>
                                <span id="visibility" class="font-semibold">-- km</span>
                            </div>
                        </div>
                    </div>

                    <!-- 日出日落卡片 -->
                    <div class="glass rounded-3xl p-6 shadow-xl flex justify-around items-center">
                        <div class="text-center">
                            <i class="fa-solid fa-sun-plant-wilt text-2xl text-amber-300 mb-1"></i>
                            <div class="text-xs text-white/70">日出時間</div>
                            <div id="sunriseTime" class="text-base font-bold mt-0.5">--:--</div>
                        </div>
                        <div class="h-8 w-[1px] bg-white/20"></div>
                        <div class="text-center">
                            <i class="fa-solid fa-moon text-2xl text-indigo-200 mb-1"></i>
                            <div class="text-xs text-white/70">日落時間</div>
                            <div id="sunsetTime" class="text-base font-bold mt-0.5">--:--</div>
                        </div>
                    </div>
                </div>

                <!-- 7 天預報列表（滿版下方） -->
                <div class="md:col-span-3 glass rounded-3xl p-6 shadow-2xl">
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fa-regular fa-calendar-days text-yellow-300"></i> 未來 7 天預報
                    </h3>
                    <div id="forecastContainer" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3">
                        <!-- 預報項目由 JavaScript 動態寫入 -->
                    </div>
                </div>

            </div>
        </main>

        <!-- 頁尾 -->
        <footer class="mt-8 text-center text-xs text-white/60">
            資料來源：<a href="https://open-meteo.com/" target="_blank" class="underline hover:text-white">Open-Meteo API</a> ｜ 台灣地區即時觀測與氣象預報
        </footer>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 台灣主要縣市座標資料庫 (緯度 Latitude, 經度 Longitude)
        const CITIES = [
            { name: "基隆市", lat: 25.1283, lng: 121.7419 },
            { name: "臺北市", lat: 25.0375, lng: 121.5637 },
            { name: "新北市", lat: 24.9984, lng: 121.4526 },
            { name: "桃園市", lat: 24.9937, lng: 121.3010 },
            { name: "新竹市", lat: 24.8138, lng: 120.9675 },
            { name: "新竹縣", lat: 24.8387, lng: 121.0077 },
            { name: "苗栗縣", lat: 24.5602, lng: 120.8214 },
            { name: "臺中市", lat: 24.1477, lng: 120.6736 },
            { name: "彰化縣", lat: 24.0815, lng: 120.5385 },
            { name: "南投縣", lat: 23.9037, lng: 120.6859 },
            { name: "雲林縣", lat: 23.7093, lng: 120.4313 },
            { name: "嘉義市", lat: 23.4800, lng: 120.4491 },
            { name: "嘉義縣", lat: 23.4588, lng: 120.2928 },
            { name: "臺南市", lat: 22.9997, lng: 120.2270 },
            { name: "高雄市", lat: 22.6273, lng: 120.3014 },
            { name: "屏東縣", lat: 22.6744, lng: 120.4880 },
            { name: "宜蘭縣", lat: 24.7570, lng: 121.7530 },
            { name: "花蓮縣", lat: 23.9871, lng: 121.6016 },
            { name: "臺東縣", lat: 22.7583, lng: 121.1444 },
            { name: "澎湖縣", lat: 23.5711, lng: 119.5793 },
            { name: "金門縣", lat: 24.4493, lng: 118.3766 },
            { name: "連江縣", lat: 26.1505, lng: 119.9499 }
        ];

        // Open-Meteo WMO 天氣代碼解析與 FontAwesome 圖示對應
        function getWeatherDetails(wmoCode) {
            const codeMap = {
                0: { text: "晴朗無雲", icon: "fa-sun", color: "text-yellow-300" },
                1: { text: "大致晴朗", icon: "fa-cloud-sun", color: "text-amber-200" },
                2: { text: "多雲時晴", icon: "fa-cloud-sun", color: "text-sky-200" },
                3: { text: "陰天多雲", icon: "fa-cloud", color: "text-gray-300" },
                45: { text: "起霧", icon: "fa-smog", color: "text-gray-300" },
                48: { text: "霧淞", icon: "fa-smog", color: "text-gray-300" },
                51: { text: "輕微毛毛雨", icon: "fa-cloud-rain", color: "text-blue-300" },
                53: { text: "毛毛雨", icon: "fa-cloud-rain", color: "text-blue-300" },
                55: { text: "濃密毛毛雨", icon: "fa-cloud-showers-heavy", color: "text-blue-400" },
                61: { text: "小雨", icon: "fa-cloud-rain", color: "text-blue-300" },
                63: { text: "陣雨", icon: "fa-cloud-showers-heavy", color: "text-blue-400" },
                65: { text: "豪雨", icon: "fa-cloud-showers-water", color: "text-blue-500" },
                80: { text: "局部陣雨", icon: "fa-cloud-sun-rain", color: "text-sky-300" },
                81: { text: "強陣雨", icon: "fa-cloud-showers-heavy", color: "text-indigo-300" },
                82: { text: "劇烈陣雨", icon: "fa-cloud-showers-water", color: "text-purple-400" },
                95: { text: "雷陣雨", icon: "fa-cloud-bolt", color: "text-yellow-400" },
                96: { text: "雷陣雨伴隨冰雹", icon: "fa-cloud-bolt", color: "text-yellow-400" }
            };
            return codeMap[wmoCode] || { text: "多雲", icon: "fa-cloud", color: "text-white" };
        }

        // DOM 元素引用
        const citySelect = document.getElementById('citySelect');
        const locateBtn = document.getElementById('locateBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const weatherView = document.getElementById('weatherView');

        // 初始化下拉選單
        function initCitySelect() {
            citySelect.innerHTML = CITIES.map(city => `<option value="${city.name}" class="bg-slate-800 text-white">${city.name}</option>`).join('');
            // 預設選擇 臺北市
            citySelect.value = "臺北市";
        }

        // 顯示 / 隱藏 載入中狀態
        function setLoading(isLoading) {
            if (isLoading) {
                loading.classList.remove('hidden');
                weatherView.classList.add('hidden');
                errorMessage.classList.add('hidden');
            } else {
                loading.classList.add('hidden');
                weatherView.classList.remove('hidden');
            }
        }

        // 顯示錯誤訊息
        function showError(msg) {
            loading.classList.add('hidden');
            weatherView.classList.add('hidden');
            errorMessage.classList.remove('hidden');
            errorText.textContent = msg;
        }

        // 從 Open-Meteo Fetch 天氣資料
        async function fetchWeatherData(lat, lng, cityName) {
            setLoading(true);

            // Open-Meteo API URL
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m&hourly=uv_index,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max&timezone=Asia%2FTaipei`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('無法從 API 取得氣象資料');
                
                const data = await response.json();
                renderWeather(data, cityName);
                setLoading(false);
            } catch (err) {
                console.error(err);
                showError('連線失敗，請檢查網路連線或稍後再試。');
            }
        }

        // 渲染資料至 UI
        function renderWeather(data, cityName) {
            const current = data.current;
            const daily = data.daily;
            const weatherDetails = getWeatherDetails(current.weather_code);

            // 更新城市與時間
            document.getElementById('cityName').textContent = cityName;
            const now = new Date();
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-TW', dateOptions);

            // 當前數值
            document.getElementById('temp').textContent = Math.round(current.temperature_2m);
            document.getElementById('weatherStateText').textContent = weatherDetails.text;
            document.getElementById('weatherIcon').innerHTML = `<i class="fa-solid ${weatherDetails.icon} ${weatherDetails.color}"></i>`;
            document.getElementById('feelsLike').textContent = `${Math.round(current.apparent_temperature)}°C`;
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
            document.getElementById('windSpeed').textContent = `${current.wind_speed_10m} km/h`;

            // 詳細氣象數值
            const rainProbability = daily.precipitation_probability_max[0] ?? 0;
            document.getElementById('rainProb').textContent = `${rainProbability} %`;
            
            // 紫外線與能見度 (使用 daily 或 hourly 近似值)
            const maxUv = daily.uv_index_max[0] ? daily.uv_index_max[0].toFixed(1) : '--';
            document.getElementById('uvIndex').textContent = maxUv;

            document.getElementById('pressure').textContent = `${Math.round(current.surface_pressure)} hPa`;

            const currentHour = now.getHours();
            const currentVis = data.hourly.visibility ? (data.hourly.visibility[currentHour] / 1000).toFixed(1) : '--';
            document.getElementById('visibility').textContent = `${currentVis} km`;

            // 日出日落
            if (daily.sunrise && daily.sunset) {
                const sunrise = new Date(daily.sunrise[0]);
                const sunset = new Date(daily.sunset[0]);
                document.getElementById('sunriseTime').textContent = sunrise.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
                document.getElementById('sunsetTime').textContent = sunset.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
            }

            // 渲染未來 7 天預報
            const forecastContainer = document.getElementById('forecastContainer');
            forecastContainer.innerHTML = '';

            const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

            for (let i = 0; i < 7; i++) {
                const dateObj = new Date(daily.time[i]);
                const dayName = i === 0 ? '今天' : weekDays[dateObj.getDay()];
                const dayWeather = getWeatherDetails(daily.weather_code[i]);
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);

                const card = document.createElement('div');
                card.className = "flex flex-col items-center justify-between p-3 rounded-2xl bg-white/10 hover:bg-white/20 transition cursor-default";
                card.innerHTML = `
                    <span class="text-xs font-semibold text-white/80">${dayName}</span>
                    <span class="text-[10px] text-white/60 mb-2">${dateObj.getMonth() + 1}/${dateObj.getDate()}</span>
                    <i class="fa-solid ${dayWeather.icon} ${dayWeather.color} text-2xl my-2"></i>
                    <span class="text-xs font-medium text-white/90 text-center">${dayWeather.text}</span>
                    <div class="mt-2 text-xs">
                        <span class="font-bold">${maxTemp}°</span>
                        <span class="text-white/60 font-light text-[11px] ml-1">${minTemp}°</span>
                    </div>
                `;
                forecastContainer.appendChild(card);
            }
        }

        // 事件控制：城市選單變更
        citySelect.addEventListener('change', (e) => {
            const selectedCityName = e.target.value;
            const cityData = CITIES.find(c => c.name === selectedCityName);
            if (cityData) {
                fetchWeatherData(cityData.lat, cityData.lng, cityData.name);
            }
        });

        // 事件控制：自動定位按鈕
        locateBtn.addEventListener('click', () => {
            if ("geolocation" in navigator) {
                setLoading(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        fetchWeatherData(lat, lng, "您的當前位置");
                    },
                    (error) => {
                        console.warn(error);
                        showError("無法取得定位授權資訊，請手動選擇城市。");
                    }
                );
            } else {
                showError("您的瀏覽器不支援定位功能。");
            }
        });

        // 頁面初始化
        window.onload = () => {
            initCitySelect();
            // 預設載入台北天氣
            const defaultCity = CITIES[1]; // 臺北市
            fetchWeatherData(defaultCity.lat, defaultCity.lng, defaultCity.name);
        };
    </script>
</body>
</html>
